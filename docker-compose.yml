---
# Authentik local dev stack — macOS / Docker Desktop
# Reference: https://docs.goauthentik.io/docs/install-config/install/docker-compose
#
# Usage:
#   1. Run ./bootstrap.sh to generate .env
#   2. docker compose pull
#   3. docker compose up -d
#   4. Open http://localhost:9000/if/flow/initial-setup/   (HTTP)
#      or https://localhost:9443/if/flow/initial-setup/   (HTTPS, self-signed)
#
# Override AUTHENTIK_TAG in .env to pin a different version.

x-authentik-env: &authentik-env
  AUTHENTIK_REDIS__HOST: redis
  AUTHENTIK_POSTGRESQL__HOST: postgresql
  AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
  AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?PG_PASS is required}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  # Disable update checks so the lab stays deterministic for eval work
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  # Increase log verbosity — handy for detection engineering / behavioural inspection
  AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?PG_PASS is required}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}

  redis:
    image: docker.io/library/redis:7-alpine
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - redis:/data

  server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2024.10}
    restart: unless-stopped
    command: server
    environment: *authentik-env
    volumes:
      - ./media:/media
      - ./custom-templates:/templates
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2024.10}
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    # Worker needs to talk to the Docker socket so it can manage outposts
    # if you ever add one (LDAP, Proxy, RADIUS). Comment out for a stricter
    # local profile.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./media:/media
      - ./certs:/certs
      - ./custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  database:
    driver: local
  redis:
    driver: local
